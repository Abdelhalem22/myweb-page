<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>عبدالحليم ناصر عبدالحكيم</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background-color: #f2f2f2;
      color: #333;
      direction: rtl;
    }

    header {
      background-color: #004466;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header p {
      font-style: italic;
      margin-top: 10px;
    }

    main {
      padding: 20px;
      text-align: center;
    }

    section {
      background-color: white;
      margin: 0 auto;
      padding: 20px;
      max-width: 600px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    footer {
      background-color: #222;
      color: #ccc;
      text-align: center;
      padding: 15px;
      margin-top: 30px;
    }

    @media (max-width: 600px) {
      section {
        padding: 15px;
      }

      header h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>

    <h1>عبدالحليم ناصر عبدالحكيم</h1>
    <p>﴿وَقُل رَّبِّ زِدْنِي عِلْمًا﴾</p>
  </header>

  <main>
    <section>
      <h2>كودي البرمجي</h2>
      <p>print("Hello, World!")</p>
    </section>
  </main>

  <footer>
    <p>جميع الحقوق محفوظة &copy; 2025</p>
  </footer>
</body>
</html>
